services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sehemistan
      POSTGRES_USER: sehemistan
      POSTGRES_PASSWORD: sehemistan
    ports:
      - "5432:5432"
    volumes:
      - sehemistan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sehemistan"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sehemistan_pg:
